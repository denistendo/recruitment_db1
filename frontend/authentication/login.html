<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="/static/authentication/signup.css">
</head>
<body>
    <div class="signup-container">
        <h2>Log In</h2>
{% if messages %}
            <div class="messages">
    {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
            </div>
{% endif %}
        <p>Login functionality coming soon.</p>
        <p><a href="{% url 'recruitmentapp:signup' %}">Create an account</a></p>
    </div>
</body>
</html>

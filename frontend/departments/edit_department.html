{% extends 'layout/base.html' %}
{% load static %}

{% block title %}Edit Department - RecruitDB{% endblock %}
{% block page_header %}Edit Department{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-building-gear me-2"></i>Edit: {{ department.department_name }}
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="department_name" class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
                        <input type="text" id="department_name" name="department_name" class="form-control" value="{{ department.department_name }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="3">{{ department.description|default:'' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Update Department
                        </button>
                        <a href="{% url 'recruitmentapp:departments' %}" class="btn btn-secondary">
                            <i class="bi bi-x-lg me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
